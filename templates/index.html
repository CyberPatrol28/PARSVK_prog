<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VK Parser</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0f1419; color: #e6e6e6; min-height: 100vh; padding: 20px; }
  .app { max-width: 900px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 30px; }
  header h1 { font-size: 32px; margin-bottom: 8px;
              background: linear-gradient(90deg,#4c8bf5,#a855f7);
              -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: #8b98a5; font-size: 14px; }
  .panel { background: #1a1f29; border: 1px solid #2a3140;
           border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .hidden { display: none !important; }
  label { display: block; margin-bottom: 8px; font-size: 14px; color: #b8c2cc; }
  textarea, input[type="number"], input[type="text"], input[type="password"] {
    width: 100%; background: #0f1419; border: 1px solid #2a3140;
    border-radius: 8px; padding: 10px 12px; color: #e6e6e6;
    font-family: inherit; font-size: 14px; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: #4c8bf5; }
  .row { display: flex; gap: 16px; align-items: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 180px; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px;
         font-weight: 600; cursor: pointer; text-decoration: none;
         display: inline-block; transition: all .2s; }
  .btn.primary { background: linear-gradient(90deg,#4c8bf5,#a855f7); color: white; }
  .btn.primary:hover { opacity: .9; transform: translateY(-1px); }
  .btn.primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.secondary { background: #2a3140; color: #e6e6e6; }
  .btn.secondary:hover { background: #353d50; }
  .progress-bar { width: 100%; height: 8px; background: #0f1419;
                  border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .progress-fill { height: 100%; width: 0%;
                   background: linear-gradient(90deg,#4c8bf5,#a855f7);
                   transition: width .3s ease; }
  .status { font-size: 14px; color: #8b98a5; }
  .results-header { display: flex; justify-content: space-between;
                    align-items: center; margin-bottom: 16px; }
  .results-header h2 { font-size: 18px; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { padding: 6px 14px; border-radius: 999px; background: #0f1419;
          border: 1px solid #2a3140; color: #b8c2cc; font-size: 13px;
          cursor: pointer; transition: all .2s; }
  .chip.active { background: #4c8bf5; color: white; border-color: #4c8bf5; }
  .chip:hover { border-color: #4c8bf5; }
  .results-list { display: flex; flex-direction: column; gap: 12px; }
  .result-item { background: #0f1419; border: 1px solid #2a3140;
                 border-radius: 10px; padding: 14px 16px; transition: border-color .2s; }
  .result-item:hover { border-color: #4c8bf5; }
  .result-item .badge { display: inline-block; padding: 2px 8px; border-radius: 4px;
                        font-size: 11px; font-weight: 600; text-transform: uppercase;
                        margin-right: 8px; }
  .badge.group { background: #4c8bf5; color: white; }
  .badge.user { background: #a855f7; color: white; }
  .result-item .link { color: #4c8bf5; text-decoration: none; font-weight: 600;
                       word-break: break-all; }
  .result-item .link:hover { text-decoration: underline; }
  .result-item .name { margin-top: 4px; font-size: 14px; color: #e6e6e6; }
  .result-item .extra { margin-top: 4px; font-size: 12px; color: #8b98a5; }
  .result-item .matches { margin-top: 6px; font-size: 12px; color: #6fdc8c; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #e74c3c;
           color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px;
           box-shadow: 0 4px 12px rgba(0,0,0,.4); z-index: 100; }
  .hint { font-size: 12px; color: #8b98a5; margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>VK Parser</h1>
    <p class="subtitle">Поиск групп и пользователей по ключевым словам</p>
  </header>

  <section class="panel">
    <label for="token">Токен VK (user-токен, не сохраняется на сервере)</label>
    <input id="token" type="password" placeholder="vk1.a...." autocomplete="off">
    <p class="hint">Нужен user-токен (scope: friends, groups). Для поиска групп/юзеров сервисный не подойдёт.</p>

    <label for="keywords" style="margin-top:16px">Ключевые слова (через запятую или с новой строки)</label>
    <textarea id="keywords" rows="3" placeholder="зацепинг, крыша поезда">зацепинг</textarea>

    <div class="row">
      <div class="field">
        <label for="count">Записей на запрос</label>
        <input id="count" type="number" min="1" max="100" value="30">
      </div>
      <div class="field">
        <label for="blacklist">Чёрный список (через запятую; пусто — из файла)</label>
        <input id="blacklist" type="text" placeholder="реклама, казино">
      </div>
      <button id="startBtn" class="btn primary">Запустить</button>
    </div>
  </section>

  <section id="progressSection" class="panel hidden">
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <p id="statusText" class="status">Запуск...</p>
  </section>

  <section id="resultsSection" class="panel hidden">
    <div class="results-header">
      <h2>Найдено: <span id="totalCount">0</span>
          <span id="filteredInfo" style="color:#8b98a5;font-size:13px"></span></h2>
      <a id="exportBtn" class="btn secondary" href="#">Скачать .txt</a>
    </div>
    <div class="filters">
      <div class="chip active" data-filter="all">Все</div>
      <div class="chip" data-filter="group">Группы</div>
      <div class="chip" data-filter="user">Юзеры</div>
    </div>
    <div id="resultsList" class="results-list"></div>
  </section>
</div>

<div id="toast" class="toast hidden"></div>

<script>
let currentTaskId = null;
let pollInterval = null;
let allResults = [];
let currentFilter = 'all';

const $ = (sel) => document.querySelector(sel);
const startBtn = $('#startBtn');
const tokenInput = $('#token');
const keywordsInput = $('#keywords');
const countInput = $('#count');
const blacklistInput = $('#blacklist');
const progressSection = $('#progressSection');
const progressFill = $('#progressFill');
const statusText = $('#statusText');
const resultsSection = $('#resultsSection');
const resultsList = $('#resultsList');
const totalCount = $('#totalCount');
const filteredInfo = $('#filteredInfo');
const exportBtn = $('#exportBtn');
const toast = $('#toast');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.remove('hidden');
  setTimeout(() => toast.classList.add('hidden'), 4000);
}
function parseKeywords(raw) {
  return raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function renderResults() {
  const filtered = currentFilter === 'all'
    ? allResults
    : allResults.filter(r => r.type === currentFilter);
  resultsList.innerHTML = '';
  if (filtered.length === 0) {
    resultsList.innerHTML = '<p style="color:#8b98a5;text-align:center;padding:20px">Ничего не найдено</p>';
    return;
  }
  for (const item of filtered) {
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = `
      <div>
        <span class="badge ${item.type}">${item.type === 'group' ? 'Группа' : 'Юзер'}</span>
        <a class="link" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">${escapeHtml(item.link)}</a>
      </div>
      <div class="name">${escapeHtml(item.name)}</div>
      ${item.extra ? `<div class="extra">${escapeHtml(item.extra)}</div>` : ''}
      <div class="matches">🔑 ${escapeHtml((item.matched_keywords || []).join(', '))}</div>
    `;
    resultsList.appendChild(div);
  }
}
async function pollStatus() {
  if (!currentTaskId) return;
  try {
    const res = await fetch(`/api/status/${currentTaskId}`);
    const data = await res.json();
    if (data.status === 'error') {
      clearInterval(pollInterval);
      statusText.textContent = '❌ Ошибка: ' + data.message;
      startBtn.disabled = false;
      showToast(data.message);
      return;
    }
    const pct = data.total ? Math.round((data.progress / data.total) * 100) : 0;
    progressFill.style.width = pct + '%';
    statusText.textContent = `${data.message} (${pct}%)`;
    if (data.status === 'done') {
      clearInterval(pollInterval);
      await loadResults();
      startBtn.disabled = false;
      statusText.textContent = '✅ Готово!';
    }
  } catch (e) {
    clearInterval(pollInterval);
    showToast('Ошибка соединения');
    startBtn.disabled = false;
  }
}
async function loadResults() {
  const res = await fetch(`/api/results/${currentTaskId}`);
  const data = await res.json();
  allResults = data.results || [];
  totalCount.textContent = allResults.length;
  const fc = (data.filtered || []).length;
  filteredInfo.textContent = fc ? `· отфильтровано: ${fc}` : '';
  exportBtn.href = `/api/export/${currentTaskId}`;
  resultsSection.classList.remove('hidden');
  renderResults();
}
startBtn.addEventListener('click', async () => {
  const token = tokenInput.value.trim();
  if (!token) { showToast('Введите токен VK'); return; }
  const keywords = parseKeywords(keywordsInput.value);
  if (keywords.length === 0) { showToast('Введите хотя бы одно ключевое слово'); return; }
  const count = parseInt(countInput.value, 10) || 30;
  const blRaw = blacklistInput.value.trim();
  const blacklist = blRaw ? parseKeywords(blRaw) : null;

  startBtn.disabled = true;
  resultsSection.classList.add('hidden');
  progressSection.classList.remove('hidden');
  progressFill.style.width = '0%';
  statusText.textContent = 'Запуск...';

  try {
    const res = await fetch('/api/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, keywords, count, blacklist })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'Ошибка запуска');
    }
    const data = await res.json();
    currentTaskId = data.task_id;
    tokenInput.value = '';   // стираем токен из DOM после отправки
    pollInterval = setInterval(pollStatus, 1000);
    pollStatus();
  } catch (e) {
    showToast(e.message || 'Не удалось запустить парсинг');
    startBtn.disabled = false;
  }
});
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderResults();
  });
});
</script>
</body>
</html>
